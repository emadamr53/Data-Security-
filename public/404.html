<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Data Security</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #030712;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #34d399;
        --cyan: #22d3ee;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        font-family: Inter, system-ui, sans-serif;
        color: var(--text);
        background: var(--bg);
        text-align: center;
      }
      .code {
        font-family: "JetBrains Mono", monospace;
        font-size: clamp(4rem, 15vw, 8rem);
        font-weight: 700;
        line-height: 1;
        background: linear-gradient(135deg, var(--accent), var(--cyan));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 {
        margin: 0.5rem 0 0;
        font-size: clamp(1.25rem, 4vw, 1.75rem);
      }
      p {
        margin: 0.75rem auto 0;
        max-width: 40ch;
        color: var(--muted);
        line-height: 1.6;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
        margin-top: 2rem;
      }
      .btn {
        display: inline-flex;
        padding: 0.85rem 1.35rem;
        font-weight: 600;
        font-size: 0.95rem;
        border-radius: 999px;
        text-decoration: none;
      }
      .btn-primary {
        background: linear-gradient(135deg, #34d399, #059669);
        color: var(--bg);
      }
      .btn-ghost {
        border: 1px solid rgba(148, 163, 184, 0.2);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Page not found</h1>
      <p>
        This route does not exist or was moved. Head back to learn about data
        security fundamentals.
      </p>
      <div class="actions">
        <a class="btn btn-primary" href="/">Back to home</a>
        <a class="btn btn-ghost" href="/#checklist">Security checklist</a>
      </div>
    </main>
  </body>
</html>
